# Alternative to `pnpm db:start` for machines with Docker.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova
    ports:
      - '54329:5432'
    volumes:
      - nova-pgdata:/var/lib/postgresql
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nova']
      interval: 5s
      retries: 10

volumes:
  nova-pgdata:
